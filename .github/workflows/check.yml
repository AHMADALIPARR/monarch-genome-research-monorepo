name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SWI-Prolog and a C compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog gcc

      - name: Install Python and rdflib
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'rdflib>=7'

      - name: Install Lean 4.12.0 (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.12.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run the repo checks
        run: make check

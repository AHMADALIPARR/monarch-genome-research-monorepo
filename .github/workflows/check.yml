name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install SWI-Prolog and a C compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swi-prolog gcc

      - name: Install Python and rdflib
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install 'rdflib>=7'

      - name: Install Lean 4.12.0 (elan)
        run: |
          curl -sSf https://release.lean-lang.org/lean4/v4.12.0/lean-4.12.0-linux.tar.zst -o /tmp/lean.tar.zst || true
          curl -sSfL https://github.com/leanprover/elan/releases/download/v3.1.1/elan-x86_64-unknown-linux-gnu.tar.gz -o /tmp/elan.tar.gz
          mkdir -p "$HOME/.elan/bin"
          tar -xzf /tmp/elan.tar.gz -C "$HOME/.elan/bin" --strip-components=1 elan-x86_64-unknown-linux-gnu/elan-init
          "$HOME/.elan/bin/elan-init" -y --default-toolchain leanprover/lean4:v4.12.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run the repo checks
        run: make check
